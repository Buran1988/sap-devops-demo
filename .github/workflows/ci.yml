name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ─── Job 1: Проверка синтаксиса через abaplint ───────────────────────
  abaplint:
    name: abaplint – синтаксический анализ
    runs-on: ubuntu-latest
    permissions:
      checks: write        # нужно для публикации аннотаций через Checks API
      contents: read
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Запуск abaplint
        uses: abaplint/actions-abaplint@main
        # В форках GITHUB_TOKEN read-only, поэтому шаг пропускается при PR из чужого fork
        if: >
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

