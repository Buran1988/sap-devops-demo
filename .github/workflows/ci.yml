name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ─── Job 1: Проверка синтаксиса через abaplint ───────────────────────
  abaplint:
    name: abaplint – синтаксический анализ
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Запуск abaplint
        uses: abaplint/actions-abaplint@main
        # actions-abaplint@0.4.0 содержит баг: npm install падает с
        # "Tracker idealTree already exists" и не устанавливает @octokit/rest.
        # Используем @main — стабильная ветка без этого бага.
        # Для аннотаций нужен GITHUB_TOKEN; в форках он read-only,
        # поэтому шаг пропускается при PR из чужого fork.
        if: >
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Job 2: ABAP Unit-тесты через transpiler ─────────────────────────
  unit-tests:
    name: ABAP Unit Tests (transpiler)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Установка зависимостей
        run: npm ci

      - name: Запуск юнит-тестов
        run: npm test